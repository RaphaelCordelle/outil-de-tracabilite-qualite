[project]
name = "quality-traceability-tool"
version = "1.9.0"
description = "Application locale de traçabilité qualité sur données fictives"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Raphaël Cordelle"}]
keywords = ["python", "quality", "traceability", "csv", "validation"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
