[project]
name = "quality-traceability-tool"
version = "1.1.0"
description = "Prototype personnel de traçabilité qualité sur données fictives"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Raphaël Cordelle"}]
keywords = ["python", "quality", "traceability", "csv", "validation"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
